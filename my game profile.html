<!DOCTYPE html><html>
    <head>
        <title>my game profile</title>
        <style>
            body{
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                background-color: chartreuse;
                text-align: center;
                padding: 30px;
            }
            h1{
                color: cornsilk;
            }
            button{
                background-color: aqua;
                color: aliceblue;
                padding: 10px 25px;
                border-radius: 20px;
                border:none;
                cursor: pointer;
            }
            div{
                border: 1px solid navy;
                width: 280px;
                margin: 6px auto;
                padding: 8px 12px;
                text-align: left;
                border-radius: 6px;
            }
        </style>
    </head>
    <body>
        <h1>my game profile</h1>
        <button onclick="showProfile()">show profile</button>
        <div>name:
            <span id="name"></span>
        </div>
        <div>score:
            <span id="score"></span>
        </div>
        <div>record:
            <span id="record"></span>
        </div>
        <div>rank:
            <span id="rank"></span>
        </div>
        <div>greeting:
            <span id="greeting"></span>
        </div>
        <div>stars:
            <span id="stars"></span>
        </div>
        <div>bonus:
            <span id="bonus"></span>
        </div>
        <div>team:
            <span id="team"></span>
        </div>
        <script>
            function showProfile(){
                //variables
                let name="saarth";
                let myscore="87";
                let highscore="100";
                let bonus=null;
                let team;

                //comparision operator
                let isTopScore=myscore==highscore;
                //if/else-rank
                let rank;
                if(myscore>=80){
                    rank="gold";
                }
                else if (myscore >= 50) {
                    rank = "silver";
                }
                else  {
                    rank = "bronze";
                }
                //dateobject-greeting
                let hour=new Date().getHours();
                let greeting;
                if(hours<12){
                    greeting="good morning";
                }
                 else if (hours < 17) {
                    greeting = "good afternoon";
                }
                 else {
                    greeting = "good evening";
                }
                //whiteloop-stars
                let stars="";
                let count=0;
                while(count<5){
                    stars=stars+"*";
                    count=count+1;
                }
            
            //string concatenation-show on page
            document.getElementById("name").innerHTML= name;
            document.getElementById("score").innerHTML = myscore+"out of"+"highscore";
            document.getElementById("record").innerHTML = isTopScore;
            document.getElementById("rank").innerHTML = rank;
            document.getElementById("greeting").innerHTML = greeting;
            document.getElementById("stars").innerHTML = stars;
            document.getElementById("bonus").innerHTML = bonus;
            document.getElementById("team").innerHTML = team;
            }
        </script>
    </body>
</html>
